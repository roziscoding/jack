services:
  jellyfin:
    image: jellyfin/jellyfin:10.9.11
    ports:
      - "18096:8096"
    volumes:
      - jellyfin-config:/config
      - ./fixtures/media:/media:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    ports:
      - "17878:7878"
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - radarr-config:/config
      - ./volumes/blackhole-completed:/downloads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7878/ping"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    ports:
      - "18989:8989"
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - sonarr-config:/config
      - ./volumes/blackhole-completed:/downloads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/ping"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  jack-alpha:
    build:
      context: ..
      dockerfile: e2e/Dockerfile
    ports:
      - "13000:3000"
    environment:
      - APP_CONFIG_PATH=/config/jack-alpha.jsonc
      - LOG_LEVEL=debug
      - PORT=3000
    volumes:
      - ./config:/config
      - ./fixtures/media:/media:ro
    depends_on:
      jellyfin:
        condition: service_healthy
      radarr:
        condition: service_healthy
      sonarr:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/servers"]
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 5s

  jack-beta:
    build:
      context: ..
      dockerfile: e2e/Dockerfile
    ports:
      - "13001:3000"
    environment:
      - APP_CONFIG_PATH=/config/jack-beta.jsonc
      - LOG_LEVEL=debug
      - PORT=3000
    volumes:
      - ./config:/config
      - ./volumes/blackhole-watch:/downloads/watch
      - ./volumes/blackhole-completed:/downloads/completed
      - ./fixtures/media:/media:ro
    depends_on:
      jack-alpha:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/servers"]
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 5s

volumes:
  jellyfin-config:
  radarr-config:
  sonarr-config:
