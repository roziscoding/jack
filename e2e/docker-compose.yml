services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    ports:
      - '17878:7878'
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - radarr-config:/config
      - ./fixtures/media:/media
      - ./volumes/blackhole-completed:/downloads/completed
    healthcheck:
      test: [CMD, curl, -f, 'http://localhost:7878/ping']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    ports:
      - '18989:8989'
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - sonarr-config:/config
      - ./fixtures/media:/media
      - ./volumes/blackhole-completed:/downloads/completed
    healthcheck:
      test: [CMD, curl, -f, 'http://localhost:8989/ping']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  jack-alpha:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    ports:
      - '13000:3000'
    environment:
      - APP_CONFIG_PATH=/config/jack-alpha.jsonc
      - LOG_LEVEL=debug
      - PORT=3000
    volumes:
      - ./config:/config
      - ./fixtures/media:/media:ro
    depends_on:
      radarr:
        condition: service_healthy
      sonarr:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, --header, 'X-Api-Key: alpha-test-key', 'http://localhost:3000/servers']
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 5s

  jack-beta:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    ports:
      - '13001:3000'
    environment:
      - APP_CONFIG_PATH=/config/jack-beta.jsonc
      - LOG_LEVEL=debug
      - PORT=3000
    volumes:
      - ./config:/config
      - ./volumes/blackhole-completed:/downloads/completed
      - ./fixtures/media:/media:ro
    depends_on:
      jack-alpha:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, --header, 'X-Api-Key: beta-test-key', 'http://localhost:3000/servers']
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 5s

volumes:
  radarr-config:
  sonarr-config:
