name: Publish Docker image

on:
  push:
    branches:
      - main
  pull_request:
    # `closed` is needed so we can clean up the PR image once it's merged.
    types: [opened, synchronize, reopened, closed]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Don't build on close — that event is only used to trigger cleanup below.
    # Skip PRs from forks — their GITHUB_TOKEN is read-only and can't push to GHCR.
    if: >-
      github.event.action != 'closed' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      packages: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # main pushes -> :main ; pull requests -> :pr-<number>
          tags: |
            type=ref,event=branch
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Short hash of the PR's head commit this image was last built from, so
      # the sticky comment shows which commit the current `pr-<number>` tag points at.
      - name: Compute short commit SHA
        id: sha
        if: github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: echo "short=${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"

      # Tell PR authors the image is up and how to use it. The sticky comment is
      # keyed by `header`, so it's updated in place on every push (no spam).
      - name: Comment image usage on the PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-docker-image
          message: |
            ### 🐳 Docker image published

            This PR has been built and pushed to GHCR:

            ```
            ghcr.io/${{ github.repository }}:pr-${{ github.event.pull_request.number }}
            ```

            Pull and run it locally:

            ```sh
            docker pull ghcr.io/${{ github.repository }}:pr-${{ github.event.pull_request.number }}
            docker run --rm ghcr.io/${{ github.repository }}:pr-${{ github.event.pull_request.number }}
            ```

            > Last built from commit `${{ steps.sha.outputs.short }}`. Heads up: this image is automatically deleted when the PR is closed.

  # When a PR is closed (merged or not), delete the `pr-<number>` image it published to GHCR.
  cleanup-pr-image:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    permissions:
      packages: write
      pull-requests: write
    steps:
      - name: Delete PR image tag from GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          TAG="pr-${PR_NUMBER}"
          echo "Looking for GHCR version tagged '${TAG}' in package ${OWNER}/${PACKAGE}"

          # Find the package version whose tag list contains pr-<number>.
          IDS="$(gh api --paginate \
            "/users/${OWNER}/packages/container/${PACKAGE}/versions" \
            --jq ".[] | select(.metadata.container.tags[]? == \"${TAG}\") | .id")"
          VERSION_ID="$(printf '%s' "${IDS}" | head -n1)"

          if [ -z "${VERSION_ID}" ]; then
            echo "No GHCR version tagged '${TAG}' found — nothing to delete."
            exit 0
          fi

          echo "Deleting version ${VERSION_ID} (tag '${TAG}')"
          gh api --method DELETE \
            "/users/${OWNER}/packages/container/${PACKAGE}/versions/${VERSION_ID}"
          echo "Deleted '${TAG}' from ghcr.io/${OWNER}/${PACKAGE}"

      # Remove the sticky image comment now that the image is gone.
      - name: Delete image comment from the PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-docker-image
          delete: true
