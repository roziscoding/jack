name: Publish Docker image

on:
  push:
    branches:
      - main
    # Version tags (e.g. v1.2.3) cut release images: :1.2.3, :1.2, :1 (and :latest).
    tags:
      - 'v*'
  pull_request:
    # `closed` is needed so we can clean up the PR image once it's merged.
    types: [opened, synchronize, reopened, closed]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Don't build on close — that event is only used to trigger cleanup below.
    # Skip PRs from forks — their GITHUB_TOKEN is read-only and can't push to GHCR.
    if: >-
      github.event.action != 'closed' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      packages: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute backend image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          # main pushes -> :main ; PRs -> :pr-<number> ; v* tags -> :1.2.3, :1.2, :1, :latest
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push backend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./apps/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Distinct cache scope so the two images don't overwrite each other's GHA cache.
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Compute UI image metadata
        id: meta-ui
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          # Published as a separate package: ghcr.io/<owner>/<repo>-ui
          images: ghcr.io/${{ github.repository }}-ui
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push UI
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./apps/ui/Dockerfile
          push: true
          tags: ${{ steps.meta-ui.outputs.tags }}
          labels: ${{ steps.meta-ui.outputs.labels }}
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui

      # Short hash of the PR's head commit this image was last built from, so
      # the sticky comment shows which commit the current `pr-<number>` tag points at.
      - name: Compute short commit SHA
        id: sha
        if: github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: echo "short=${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"

      # Tell PR authors the image is up and how to use it. The sticky comment is
      # keyed by `header`, so it's updated in place on every push (no spam).
      - name: Comment image usage on the PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3
        with:
          header: pr-docker-image
          message: |
            ### 🐳 Docker images published

            This PR has been built and pushed to GHCR:

            ```
            ghcr.io/${{ github.repository }}:pr-${{ github.event.pull_request.number }}        # backend
            ghcr.io/${{ github.repository }}-ui:pr-${{ github.event.pull_request.number }}     # management UI
            ```

            Pull them locally:

            ```sh
            docker pull ghcr.io/${{ github.repository }}:pr-${{ github.event.pull_request.number }}
            docker pull ghcr.io/${{ github.repository }}-ui:pr-${{ github.event.pull_request.number }}
            ```

            Run the backend standalone:

            ```sh
            docker run --rm ghcr.io/${{ github.repository }}:pr-${{ github.event.pull_request.number }}
            ```

            The UI needs the backend + a management key, so run the two together with [`examples/docker-compose.yml`](../blob/main/examples/docker-compose.yml), overriding the image tags to `pr-${{ github.event.pull_request.number }}`.

            > Last built from commit `${{ steps.sha.outputs.short }}`. Heads up: these images are automatically deleted when the PR is closed.

  # When a PR is closed (merged or not), delete the `pr-<number>` image it published to GHCR.
  cleanup-pr-image:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    permissions:
      packages: write
      pull-requests: write
    steps:
      - name: Delete PR image tags from GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          # Both packages built by this PR: the backend and the management UI.
          PACKAGES: ${{ github.event.repository.name }} ${{ github.event.repository.name }}-ui
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          TAG="pr-${PR_NUMBER}"

          for PACKAGE in ${PACKAGES}; do
            echo "Looking for GHCR version tagged '${TAG}' in package ${OWNER}/${PACKAGE}"

            # Find the package version whose tag list contains pr-<number>.
            IDS="$(gh api --paginate \
              "/users/${OWNER}/packages/container/${PACKAGE}/versions" \
              --jq ".[] | select(.metadata.container.tags[]? == \"${TAG}\") | .id")"
            VERSION_ID="$(printf '%s' "${IDS}" | head -n1)"

            if [ -z "${VERSION_ID}" ]; then
              echo "No GHCR version tagged '${TAG}' found in ${PACKAGE} — nothing to delete."
              continue
            fi

            echo "Deleting version ${VERSION_ID} (tag '${TAG}') from ${PACKAGE}"
            gh api --method DELETE \
              "/users/${OWNER}/packages/container/${PACKAGE}/versions/${VERSION_ID}"
            echo "Deleted '${TAG}' from ghcr.io/${OWNER}/${PACKAGE}"
          done

      # Remove the sticky image comment now that the image is gone.
      - name: Delete image comment from the PR
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3
        with:
          header: pr-docker-image
          delete: true
