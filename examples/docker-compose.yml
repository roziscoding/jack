services:
  jack:
    # Pre-built image published to GitHub Container Registry on every push to main.
    image: ghcr.io/roziscoding/jack:main
    container_name: jack
    restart: unless-stopped
    ports:
      - "${JACK_PORT:-3000}:3000"
    environment:
      # production turns off pino-pretty and structured-logs JSON
      ENVIRONMENT: production
      LOG_LEVEL: info
      PORT: 3000
      APP_CONFIG_PATH: /config/config.jsonc
    volumes:
      # App config. Drop your config.jsonc in a ./config dir next to this file
      # (start from the config.jsonc template in this examples/ folder).
      - ./config:/config
      # Media library. jack streams files to peers using the paths your
      # Jellyfin reports, so it must see those files at the SAME path inside
      # the container. Mirror your Jellyfin/*arr media mount here.
      - ${MEDIA_PATH:-./data/media}:/data/media
      # Blackhole download dirs — must match `downloads.*` in config.jsonc.
      - ${TORRENTS_PATH:-./data/torrents}:/data/torrents
    # If Jellyfin / Radarr / Sonarr run in their own compose network,
    # attach this service to it so `jack.baseUrl` / server URLs resolve by
    # container name. Otherwise reach them via host IP.
    # networks:
    #   - media
# networks:
#   media:
#     external: true
