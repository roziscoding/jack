services:
  jack:
    # Pre-built image published to GitHub Container Registry on every push to main.
    image: ghcr.io/roziscoding/jack:main
    container_name: jack
    restart: unless-stopped
    ports:
      - "${JACK_PORT:-5225}:5225"
    environment:
      # production turns off pino-pretty and structured-logs JSON
      ENVIRONMENT: production
      LOG_LEVEL: info
      PORT: 5225
      APP_CONFIG_PATH: /config/config.jsonc
    volumes:
      # App config. Drop your config.jsonc in a ./config dir next to this file
      # (start from the config.jsonc template in this examples/ folder).
      - ./config:/config
      # Media library. jack streams files to peers using the paths your
      # Radarr/Sonarr report, so it must see those files at the SAME path inside
      # the container. Mirror your *arr media mount here.
      - ${MEDIA_PATH:-./data/media}:/data/media
      # Blackhole download dirs — must match `downloads.*` in config.jsonc.
      # IMPORTANT: mount this SAME folder into your Radarr and Sonarr containers
      # at the SAME path (e.g. /data/torrents). jack registers the Torrent
      # Blackhole client with these literal paths, and *arr resolves them in its
      # own filesystem — if they don't match, *arr can't drop stubs or import.
      - ${TORRENTS_PATH:-./data/torrents}:/data/torrents
    # If Radarr / Sonarr run in their own compose network, attach this service
    # to it so `jack.baseUrl` / server URLs resolve by container name.
    # Otherwise reach them via host IP.
    # networks:
    #   - media
# networks:
#   media:
#     external: true
